name: Publish manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/publish-pdf.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip pdf]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra lmodern
      - name: Build identified preprint
        run: make paper
      - name: Reject unresolved references or citations
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" paper/build/main.log; then
            echo "Unresolved references or citations detected."
            exit 1
          fi
      - name: Commit compiled PDF when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/mechanistic_localization_is_support_relative.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF is already current."
          else
            git commit -m "Build public manuscript PDF [skip pdf]"
            git push origin HEAD:main
          fi
