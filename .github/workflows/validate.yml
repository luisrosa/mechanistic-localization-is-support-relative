name: Validate manuscript

on:
  push:
    branches: [main]
  pull_request:

jobs:
  finite-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run finite regression checks
        run: make check

  latex-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra lmodern
      - name: Build manuscript
        run: make paper
      - name: Reject unresolved references or citations
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" paper/build/main.log; then
            echo "Unresolved references or citations detected."
            exit 1
          fi
      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: mechanistic-localization-is-support-relative
          path: paper/mechanistic_localization_is_support_relative.pdf
